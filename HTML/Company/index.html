<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKinfotech</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row main-wrapper">

            <!-- image -->
            <div class="col-md-6 d-flex justify-content-center">
                <div class="oval-wrapper">
                    <img src="images/hero-image.png" alt="image">
                </div>
            </div>

            <!-- content -->
            <div class="col-md-6 d-flex align-items-center">
                <div class="login-box w-100">
                    <img src="images/logo.svg" class="mb-4" alt="logo">

                    <p class="tagline mb-4">
                        We are <span>experts</span> in business, marketing,<br>
                        growth, & sales.
                    </p>

                    <p class="mb-3 login">Login into your account</p>

                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Username">
                        </div>

                        <div class="mb-2">
                            <input type="password" class="form-control" placeholder="Password">
                        </div>

                        <div class="d-flex align-items-center mb-4">
                            <button class="btn btn-danger login-btn" style="font-size: 14px;">Login</button>
                            <div class="ms-auto">
                                <a href="#" class="forgot">Forgot Password?</a>
                            </div>
                        </div>

                        <p class="register">
                            Are you a new member?
                            <a href="#">Register here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
