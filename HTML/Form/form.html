<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create new account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container my-4 min-vh-100">
    <h3 class="mb-3 text-secondary">Create new account</h3>

    <form class="border p-4">

        <!-- Account Information -->
        <div class="info">Account Information</div>

        <div class="row g-3 mt-2">
            <div class="col-md-5">
                <input type="email" class="form-control" placeholder="* Email id">
            </div>
            <div class="col-md-2">
                
            </div>
            <div class="col-md-5">
                <input type="email" class="form-control" placeholder="* Confirm email id">
            </div>
            <div class="col-md-5">
                <input type="password" class="form-control" placeholder="* Password">
            </div>
            <div class="col-md-2">
                
            </div>
            <div class="col-md-5">
                <input type="password" class="form-control" placeholder="* Re password">
            </div>
        </div>

        <!-- Personal Information -->
        <div class="info mt-4">Personal Information</div>

        <div class="row g-3 mt-2">
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="* Company Name">
            </div>
            <div class="col-md-1">
                
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="* First name">
            </div>
            <div class="col-md-1">
                
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Last name">
            </div>

            <div class="col-md-3">
                <select class="form-select">
                    <option>Select country</option>
                    <option>India</option>
                    <option>USA</option>
                    <option>Australia</option>
                </select>
            </div>
            <div class="col-md-1">
                <!-- <input type="email" class="form-control" placeholder="* Email id"> -->
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="* State">
            </div>
            <div class="col-md-1">
                <!-- <input type="email" class="form-control" placeholder="* Email id"> -->
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="* City">
            </div>
            <div class="col-md-1">
                <!-- <input type="email" class="form-control" placeholder="* Email id"> -->
            </div>

            <div class="col-md-3 offset-md-4">
                <input type="text" class="form-control" placeholder="* Zip">
            </div>
            <div class="col-md-1">
                <!-- <input type="email" class="form-control" placeholder="* Email id"> -->
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="* Phone">
            </div>

            <div class="col-md-12">
                <textarea class="form-control" rows="3" placeholder="* Address"></textarea>
            </div>
        </div>

        <!-- Terms -->
        <div class="info mt-4">Term and Conditions</div>

        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" style="background-color: #d4c5c5;">
            <label class="form-check-label">
                Please check this box to confirm your agreement to the
                <a href="#">terms and conditions</a>.
            </label>
        </div>

        <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" style="background-color: #d4c5c5;">
             <label class="form-check-label">
                Please check this box to allow us to add you to our email list.
            </label>
        </div>

        <!-- Buttons -->
        <div class="text-end mt-4">
            <!-- <button type="button" class="btn text-white px-4" id="btn1" style="background-color: chocolate;"><a href="welcome.html">Sign Up</a></button> -->
            <button type="button" class="btn text-white px-4" id="btn1" style="background-color: chocolate; border-radius: 0%; font-weight: bold;">Sign Up</button>
            <button type="button" class="btn btn-outline-secondary px-4" style="border-radius: 0%;">Cancel</button>
        </div>

    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="form.js"></script>
</body>
</html>
